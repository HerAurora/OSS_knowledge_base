<!-- 在仓库中创建 `chatbot.html` -->
<!DOCTYPE html>
<html>
<head>
    <title>学院问答助手</title>
    <style>
        #chat-container { width: 360px; height: 500px; border: 1px solid #ddd; }
        #messages { height: 420px; overflow-y: auto; padding: 10px; }
        .user-msg { text-align: right; color: #0366d6; }
        .bot-msg { text-align: left; color: #22863a; }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="messages"></div>
        <input type="text" id="user-input" placeholder="输入问题...">
        <button onclick="sendQuestion()">发送</button>
    </div>

    <script>
        // 通过代理访问后端 API
        async function sendQuestion() {
            const input = document.getElementById('user-input').value;
            const response = await fetch('http://111.47.28.118:8099/ui/chat/05cede33b30504ac', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: input })
            });
            const data = await response.json();
            displayMessage(data.answer);
        }

        function displayMessage(text, isUser=false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = isUser ? 'user-msg' : 'bot-msg';
            msgDiv.textContent = text;
            document.getElementById('messages').appendChild(msgDiv);
        }
    </script>
</body>
</html>
